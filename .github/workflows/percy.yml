name: Percy Visual Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  percy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run Percy visual tests with Playwright
        run: npx percy exec -- npx playwright test Percy/
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
