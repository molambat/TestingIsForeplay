name: 🔐 OWASP ZAP Security Scan

on:
  workflow_dispatch:

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'https://lambodrip.com'  # ← Pour tester que tout marche
          fail_action: false
          token: ${{ secrets.GITHUB_TOKEN }}
          cmd_options: '-r report_html.html -w report_md.md -x report_json.json'

      - name: Upload ZAP Reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            report_html.html
            report_md.md
            report_json.json
